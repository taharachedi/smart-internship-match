name: Match offers (manual)

# Run after each manual Adzuna fetch + structuring (at most once a week).
"on":
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Match offers with my skills
        run: python scripts/match_offers.py
      - name: Commit matches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/matches.json
          git commit -m "Update matches (Adzuna) [manual]" || echo "Nothing to commit"
          git push
