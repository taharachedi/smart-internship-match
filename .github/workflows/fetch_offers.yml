name: Fetch internship offers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # France Travail "Offres d'emploi v2" is not available for new applications
      # (API missing from the catalog) -> the step is kept but does not block the pipeline.
      - name: Fetch France Travail offers (optional)
        continue-on-error: true
        env:
          FRANCETRAVAIL_CLIENT_ID: ${{ secrets.FRANCETRAVAIL_CLIENT_ID }}
          FRANCETRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCETRAVAIL_CLIENT_SECRET }}
        run: python scripts/fetch_offers.py

      - name: Match offers with my skills
        run: python scripts/match_offers.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/matches.json
          if [ -f data/offers/raw_offers.json ]; then git add data/offers/raw_offers.json; fi
          git diff --cached --quiet || git commit -m "Update matches"
          git push
